{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>

  {{ if .Pages }}
  <ul class="entry-list">
    {{ range .Pages }}
    <li>
      <h2 class="entry-title">
        <a href="{{ .Permalink }}">{{ .Title }}</a>
      </h2>
      {{ with .Description }}
      <p class="entry-description">{{ . }}</p>
      {{ end }}
    </li>
    {{ end }}
  </ul>
  {{ else }}
  <p>No entries yet.</p>
  {{ end }}
{{ end }}
