{{ define "main" }}
  <div class="home-intro">
    {{ .Content }}
  </div>

  {{ range .Site.Sections }}
  <section class="home-section">
    <p class="home-section-heading">{{ .Title }}</p>
    <ul class="entry-list">
      {{ range first 3 .Pages }}
      <li>
        <h2 class="entry-title">
          <a href="{{ .Permalink }}">{{ .Title }}</a>
        </h2>
        {{ with .Description }}
        <p class="entry-description">{{ . }}</p>
        {{ end }}
      </li>
      {{ end }}
    </ul>
    <p><a href="{{ .Permalink }}">All {{ .Title | lower }} →</a></p>
  </section>
  {{ end }}
{{ end }}
