baseURL = 'https://steelcj.github.io/chrissteel.com/'
title = 'Christopher Steel'
publishDir = 'site'

defaultContentLanguage = 'en-ca'
defaultContentLanguageInSubdir = true

[languages]
  [languages.en-ca]
    locale = 'en-CA'
    label = 'English (Canada)'
    contentDir = 'content/en-ca'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menus.main]]
  name = "Projects"
  pageRef = "/projects"
  weight = 1

[[menus.main]]
  name = "Writing"
  pageRef = "/writing"
  weight = 2

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 3

[[menus.main]]
  name = "Contact"
  pageRef = "/contact"
  weight = 4
